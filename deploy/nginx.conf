# nginx for Poster Studio (see Dockerfile): a static site. Posters never reach the server; they stay in the browser.

# Built files have a hash in their name and never change; everything else (the page, the example, the templates)
# is checked for a new version on every visit.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # Scripts only from this site. Pictures, fonts and the poster preview come from the browser itself (data: and blob:
    # URLs, srcdoc frames); the preview page adds its own, stricter policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The editor asks for the list of templates; add your own by mounting files into this folder (see README)
    location /templates/ {
        autoindex on;
        autoindex_format json;
    }
}
