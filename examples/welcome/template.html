<!doctype html>
<!-- A neutral poster template without logos: a starting point for your own template.

     How a template works (see docs/template-format.md): the poster engine replaces <slot name="header">, <slot name="sections">,
     <slot name="references"> and <slot name="footer"> with the poster's content. The element around the sections slot becomes the grid of boxes
     (one box per name in the poster's layout map, <section class="area" data-area="name">).
     The SETTINGS block holds what posters may change in their poster.yaml (settings: font-size: 30pt).
     Fonts and pictures are inlined at the end of the file, so this one file is the whole template. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="poster-template" content="name=Neutral; version=2026.1">
  <title>Poster · Neutral</title>
  <style>
/* =====================================================================
   SETTINGS: change these values, everything else adapts.
   ===================================================================== */
:root {
  /* Paper size. A0 portrait: 841mm × 1189mm, A0 landscape: 1189mm × 841mm,
     A1 portrait: 594mm × 841mm. Printing uses the same size automatically. */
  --width: 841mm;
  --height: 1189mm;

  /* Spacing */
  --margin: 28mm;          /* space around the edge */
  --gap: 18mm;             /* space between boxes and text columns */

  /* Text */
  --font: Jost, sans-serif;
  --font-size: 32pt;       /* body text; headings and captions grow and shrink with it */
  --title-size: 80pt;      /* keep the title to two lines */

  /* Colours */
  --primary: #23535F;      /* title, headings, bars */
  --accent: #C8553D;       /* key message bar, list bullets */
  --surface: #EEF3F4;      /* key message, highlighted boxes, diagram boxes */
  --text: #1C2326;
  --muted: #66727A;        /* authors, captions, chart labels */

  /* Chart colours, used in this order (checked for colour blindness).
     The first three work in every chart; label series 4, 6 and 7 directly. */
  --pele-series-1: #23535F;
  --pele-series-2: #C8553D;
  --pele-series-3: #6250D6;
  --pele-series-4: #1BAF7A;
  --pele-series-5: #008300;
  --pele-series-6: #E87BA4;
  --pele-series-7: #EDA100;
  --pele-series-8: #E34948;

  /* Captions and references (German labels below) */
  --figure-label: "Figure";
  --table-label: "Table";
  --references-label: "References";

  /* Height of the footer */
  --footer-height: 60mm;
}

/* lang: de in poster.yaml */
:root:lang(de) {
  --figure-label: "Abbildung";
  --table-label: "Tabelle";
  --references-label: "Literatur";
}

/* =====================================================================
   DESIGN
   ===================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
}

.poster {
  position: relative;
  display: flex;
  flex-direction: column;
  width: var(--width);
  height: var(--height);
  padding: var(--margin) var(--margin) calc(var(--footer-height) + var(--margin) * 0.5);
  overflow: hidden;
  counter-reset: figure table;
  background: #ffffff;
  border-top: 12mm solid var(--primary);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--font-size);
  line-height: 1.35;

  /* Diagrams and charts (Pele) */
  --pele-font: var(--font);
  --pele-fg: var(--text);
  --pele-muted: var(--muted);
  --pele-line: var(--muted);
  --pele-surface: var(--surface);
  --pele-border: var(--primary);
  --pele-accent: var(--primary);
}

/* Header (header.md): title, authors, affiliations, key message */
header {
  flex: none;
  margin-bottom: var(--gap);
}

header h1 {
  margin: 0 0 0.3em;
  font-size: var(--title-size);
  line-height: 1.08;
  color: var(--primary);
  text-wrap: pretty;
}

header > p {
  margin: 0 0 0.2em;
  font-size: 1.15em;
}

header > p ~ p {
  font-size: 0.8em;
  color: var(--muted);
}

header blockquote {
  margin: calc(var(--gap) * 0.9) 0 0;
  border-left-color: var(--accent);
  font-size: 1.3em;
}

sup {
  line-height: 0;
}

/* The boxes of the layout map; the engine places them */
main {
  flex: 1;
  min-height: 0;
  gap: var(--gap);
}

blockquote {
  margin: 0 0 calc(var(--gap) * 0.9);
  padding: 0.6em 0.8em;
  border-left: 0.3em solid var(--primary);
  background: var(--surface);
  break-inside: avoid;
}

blockquote > :last-child {
  margin-bottom: 0;
}

/* "> [!goal] …" puts an icon (https://lucide.dev/icons) in front of the text */
blockquote:has(> .icon) {
  display: grid;
  grid-template-columns: 1.4em 1fr;
  column-gap: 0.5em;
}

blockquote:has(> .icon) > :not(.icon) {
  grid-column: 2;
}

blockquote > .icon {
  grid-row: 1 / span 9;
  color: var(--primary);
}

blockquote > .icon svg {
  display: block;
  width: 1.4em;
  height: 1.4em;
}

h2 {
  margin: 0 0 0.45em;
  padding-bottom: 0.15em;
  border-bottom: 0.1em solid var(--primary);
  color: var(--primary);
  font-size: 1.35em;
  line-height: 1.15;
  break-after: avoid;
}

* + h2 {
  margin-top: calc(var(--gap) * 0.9);
}

h3 {
  margin: 0.9em 0 0.3em;
  font-size: 1.1em;
  break-after: avoid;
}

p,
ul,
ol {
  margin: 0 0 0.6em;
}

p {
  hyphens: auto;
}

ul,
ol {
  padding-left: 1.1em;
}

li {
  margin-bottom: 0.2em;
}

li::marker {
  color: var(--accent);
}

a {
  color: inherit;
  text-decoration: none;
}

.area > :last-child,
.area > :last-child > :last-child {
  margin-bottom: 0;
}

figure {
  margin: 0 0 0.9em;
  break-inside: avoid;
}

figure img {
  display: block;
  width: 100%;
}

.figure-title {
  margin-bottom: 0.4em;
  font-size: 0.85em;
  font-weight: 700;
  line-height: 1.2;
}

.diagram {
  margin-bottom: 0.9em;
  break-inside: avoid;
}

figure .diagram {
  margin-bottom: 0;
}

.pele-line path {
  stroke-width: 5px;
}

.pele-edge path {
  stroke-width: 3px;
}

figcaption {
  margin-top: 0.4em;
  font-size: 0.75em;
  line-height: 1.3;
  color: var(--muted);
}

figure:not(.table):has(figcaption) {
  counter-increment: figure;
}

figure:not(.table) figcaption::before {
  content: var(--figure-label) " " counter(figure) ". ";
  font-weight: 700;
  color: var(--text);
}

figure.table {
  counter-increment: table;
}

.table figcaption {
  margin: 0 0 0.4em;
}

.table figcaption::before {
  content: var(--table-label) " " counter(table) ". ";
  font-weight: 700;
  color: var(--text);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8em;
  font-variant-numeric: tabular-nums;
}

th,
td {
  padding: 0.3em 0.45em;
  text-align: left;
  vertical-align: top;
}

th:not(:first-child),
td:not(:first-child) {
  text-align: right;
}

td:not(:first-child) {
  white-space: nowrap;
}

th {
  border-bottom: 0.1em solid var(--text);
}

tbody tr:nth-child(odd) {
  background: var(--surface);
}

pre {
  padding: 0.5em 0.7em;
  background: var(--surface);
  font-size: 0.75em;
  white-space: pre-wrap;
  break-inside: avoid;
}

/* `code` in the text: marks and file names, as in a guide */
code {
  padding: 0.05em 0.25em;
  border-radius: 0.15em;
  background: var(--surface);
  font-family: ui-monospace, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace;
  font-size: 0.85em;
}

pre code {
  padding: 0;
  background: none;
  font-size: inherit;
}

.error {
  color: #d03b3b;
  font-weight: 700;
}

/* References: every [^name] of the poster in one numbered list, in small print below the boxes */
.references {
  flex: none;
  margin-top: calc(var(--gap) * 0.7);
  font-size: 0.6em;
  line-height: 1.3;
  color: var(--muted);
}

/* No references, no space */
.references:not(:has(li)) {
  display: none;
}

.footnotes h2 {
  position: relative;
  margin: 0 0 0.3em;
  padding: 0;
  background: none;
  color: var(--text);
  font-size: 1em;
  visibility: hidden; /* replaces the built-in heading "Footnotes" with --references-label */
}

.footnotes h2::before {
  content: var(--references-label);
  position: absolute;
  inset: 0;
  visibility: visible;
}

.footnotes ol {
  margin: 0;
  padding-left: 1.4em;
  column-count: 2;
  column-gap: var(--gap);
}

.footnotes li {
  break-inside: avoid;
}

.data-footnote-backref {
  display: none;
}

/* Footer (footer.md): pictures and notes on the left, the contact block (last paragraph) on the right */
footer {
  position: absolute;
  right: var(--margin);
  bottom: 0;
  left: var(--margin);
  display: flex;
  align-items: center;
  gap: var(--gap);
  height: var(--footer-height);
  border-top: 0.1em solid var(--primary);
  font-size: 0.7em;
  line-height: 1.3;
}

footer p {
  margin: 0;
  hyphens: manual;
}

footer p:has(img) {
  display: flex;
  align-items: center;
  gap: 0.6em;
}

footer img {
  height: calc(var(--footer-height) * 0.65);
}

footer p:not(:has(img)):not(:last-child) {
  max-width: 35%;
  color: var(--muted);
}

footer p:last-child {
  margin-left: auto;
  text-align: right;
}
  </style>
</head>
<body>
  <article class="poster">
    <header>
      <slot name="header">
        <h1>Title of the poster, at most two lines</h1>
        <p>Author One<sup>1</sup>, Author Two<sup>2</sup></p>
        <p><sup>1</sup> Institute · <sup>2</sup> Department</p>
      </slot>
    </header>
    <main>
      <slot name="sections"><p>The boxes of the layout map appear here.</p></slot>
    </main>
    <aside class="references">
      <slot name="references"></slot>
    </aside>
    <footer>
      <slot name="footer"><p>Conference · Funding</p><p><strong>Contact</strong><br>name@example.org</p></slot>
    </footer>
  </article>
